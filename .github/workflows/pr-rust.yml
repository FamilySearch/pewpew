on:
  pull_request:
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'

name: Pull Request Rust
jobs:
  test:
    name: Test Suite
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo test --all -- --skip providers::tests::range_provider_works --skip providers::tests::literals_provider_works
        timeout-minutes: 20
      # These two intermittently hang, most often on macos. Three layers guard them, because no
      # single one covers every case:
      #   1. each test wraps its body in a tokio::time::timeout, so a hang inside the test fails
      #      fast and names the case rather than blocking;
      #   2. the retry loop below re-runs a failed attempt up to 3 times, since the failure is rare
      #      and not reproducible on demand (about 1 in 2000 locally on linux);
      #   3. `timeout-minutes` is the backstop. It is enforced by the runner rather than the shell,
      #      so unlike `timeout` it works on all three OSes -- macos has no GNU timeout and neither
      #      does Windows. It is what catches a wedge at runtime shutdown, after the test body has
      #      already returned and the in-test timeout can no longer fire.
      # `shell: bash` is explicit so the loop is identical on windows-latest.
      - name: providers::tests::range_provider_works
        shell: bash
        timeout-minutes: 5
        run: |
          # Actions runs this with `-e`, so the cargo invocation has to sit inside an `if`
          # condition -- a bare `out=$(...)` assignment would abort the whole step on the first
          # failure instead of retrying.
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            if out=$(cargo test --lib providers::tests::range_provider_works -- --exact --test-threads=1 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$out"
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              # A filter that matches nothing also exits 0 ("0 passed; ... filtered out"), so a
              # rename would silently turn this step into a no-op. Require that it actually ran.
              if echo "$out" | grep -q "1 passed"; then exit 0; fi
              echo "ERROR: the filter matched no test -- has it been renamed or moved?"
              exit 1
            fi
            echo "attempt $attempt failed with exit code $rc"
          done
          echo "all 3 attempts failed"
          exit 1
      - name: providers::tests::literals_provider_works
        shell: bash
        timeout-minutes: 5
        run: |
          # Actions runs this with `-e`, so the cargo invocation has to sit inside an `if`
          # condition -- a bare `out=$(...)` assignment would abort the whole step on the first
          # failure instead of retrying.
          for attempt in 1 2 3; do
            echo "::group::attempt $attempt"
            if out=$(cargo test --lib providers::tests::literals_provider_works -- --exact --test-threads=1 2>&1); then
              rc=0
            else
              rc=$?
            fi
            echo "$out"
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              # A filter that matches nothing also exits 0 ("0 passed; ... filtered out"), so a
              # rename would silently turn this step into a no-op. Require that it actually ran.
              if echo "$out" | grep -q "1 passed"; then exit 0; fi
              echo "ERROR: the filter matched no test -- has it been renamed or moved?"
              exit 1
            fi
            echo "attempt $attempt failed with exit code $rc"
          done
          echo "all 3 attempts failed"
          exit 1

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: rustup component add clippy
      - run: cargo clippy --all -- -D warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update
      - run: cargo install cargo-deny --locked
      - run: cargo deny check --hide-inclusion-graph licenses sources advisories

  build:
    name: Build
    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: false
          - build: arm-v7
            os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            linker: gcc-arm-linux-gnueabihf
            cross: true
          - build: aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            linker: gcc-aarch64-linux-gnu
            cross: true
          - build: macos-x86
            os: macos-latest
            cross: false
          # https://docs.github.com/en/actions/using-github-hosted-runners/about-larger-runners/about-larger-runners
          # macos-latest-xlarge or macos-13-xlarge are running on arm64 (m1)
          - build: macos-aarch64
            os: macos-latest-xlarge
            cross: false
          - build: windows
            os: windows-latest
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linker
        if: matrix.cross
        run: |
          sudo apt update
          sudo apt install ${{ matrix.linker }}

      - run: rustup toolchain install stable --profile minimal --no-self-update
      # TODO: Consider https://github.com/Swatinem/rust-cache for caching of dependencies

      - name: Build for non-Linux # Windows and MacOS
        if: matrix.os != 'ubuntu-latest'
        run: cargo build -q --release

      - run: rustup target add ${{ matrix.target }} --toolchain stable
        if: matrix.cross
      - run: cargo install cross
        if: matrix.cross

      - name: Build with cross # ARM builds
        if: matrix.cross
        run: cross build -q --release --target ${{ matrix.target }}

      - name: Build for Linux
        uses: ./.github/actions/linux-x86_64-musl/
        if: matrix.build == 'linux'
        with:
          args: cargo build -q --release --target x86_64-unknown-linux-musl

      - name: Build Test Server for Linux
        uses: ./.github/actions/linux-x86_64-musl/
        if: matrix.build == 'linux'
        with:
          args: cargo build -q --release --bin test-server --target x86_64-unknown-linux-musl

      - name: Test Examples with Try Scripts
        if: matrix.build == 'linux'
        run: |
          set -e  # Exit on any error
          set -x  # Print commands for debugging

          export RUST_LOG=warn
          # Start test-server in background (600s = 10 minutes timeout)
          PORT=8082 timeout 600 ./target/x86_64-unknown-linux-musl/release/test-server > /dev/null 2>&1 &
          TEST_SERVER_PID=$!
          sleep 2

          # Test with try scripts (will exit with error if any test fails)
          cd examples
          PORT=8082 ./test_examples_try.sh ../target/x86_64-unknown-linux-musl/release/pewpew || {
            EXIT_CODE=$?
            echo "ERROR: test_examples_try.sh failed with exit code $EXIT_CODE"
            kill $TEST_SERVER_PID 2>/dev/null || true
            exit $EXIT_CODE
          }

          # Test with run scripts (will exit with error if any test fails)
          PORT=8082 ./test_examples.sh ../target/x86_64-unknown-linux-musl/release/pewpew || {
            EXIT_CODE=$?
            echo "ERROR: test_examples.sh failed with exit code $EXIT_CODE"
            kill $TEST_SERVER_PID 2>/dev/null || true
            exit $EXIT_CODE
          }
          cd ..

          # Clean up
          kill $TEST_SERVER_PID 2>/dev/null || true
          echo "✅ All examples testing complete - PASSED"

  wasm-pack:
    name: Wasm Build
    strategy:
      matrix:
        wasm-dirctory: [config-wasm, hdr-histogram-wasm]
        node-version: [20.x, 22.x, 24.x]
    runs-on: ubuntu-latest
    env:
      WASM_FILE: ${{ matrix.wasm-dirctory }}_bg.wasm
      wasm-directory: ./lib/${{ matrix.wasm-dirctory }}
      test-directory: ./lib/${{ matrix.wasm-dirctory }}/tests
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Create the Web Assembly
        id: wasm_pack
        run: |
          set -x
          # install wasm-pack
          mkdir ~/bin
          PATH=$PATH:~/bin
          curl -sSL https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz --strip-components=1 -C ~/bin --no-anchored wasm-pack

          wasm-pack build --release -t nodejs --scope fs
        working-directory: ${{env.wasm-directory}}
        shell: bash

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies ${{ matrix.node-version }}
        run: npm ci
        working-directory: ${{env.test-directory}}
      - name: Run Acceptance Tests ${{ matrix.node-version }}
        run: npm test
        working-directory: ${{env.test-directory}}
