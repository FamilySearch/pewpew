[package]
name = "pewpew"
version.workspace = true
edition = "2018"
default-run = "pewpew"
publish = false
license.workspace = true

[lib]
doctest = false

[[bin]]
name = "pewpew"
path = "src/bin/pewpew.rs"

[[bin]]
name = "test-server"
path = "src/bin/test_server.rs"

[dependencies]
base64.workspace = true
body_reader = { path = "./lib/body_reader" }
bytes.workspace = true
channel = { path = "./lib/channel" }
clap = { version = "4", features = ["derive", "cargo", "std", "help", "usage", "error-context", "wrap_help"], default-features = false }
config.workspace = true
csv = "1"
ctrlc = "3"
chrono = "0.4"
ether.workspace = true
for_each_parallel = { path = "./lib/for_each_parallel" }
futures.workspace = true
futures-timer.workspace = true
hdrhistogram = "7"
http.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-tls = "0.6"
hyper-util = { workspace = true, features = ["tokio", "client", "http1", "http2"] }
http-body-util.workspace = true
itertools.workspace = true
mod_interval = { path = "./lib/mod_interval" }
native-tls = "0.2"
once_cell.workspace = true
rand.workspace = true
regex.workspace = true
select_any = { path = "./lib/select_any" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
test_common = { path = "./lib/test_common" }
thiserror.workspace = true
tokio.workspace = true
tokio-stream = { version = "0.1", features = ["sync", "time"] }
url.workspace = true
yansi = "1"
zip_all.workspace = true
# https://github.com/softprops/json-env-logger/issues/6
log = { workspace = true, features = ["kv_unstable_std"] }
env_logger.workspace = true
json_env_logger = { version = "0.1", features = ["iso-timestamps"] }
# https://github.com/sfackler/rust-openssl/issues/1021#issuecomment-605602642
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
futures-timer.workspace = true
maplit = "1"
serde_yaml.workspace = true
tempfile = "3"

[profile.release]
panic = "abort"
lto = "fat"

[profile.release.package.config-gen]
opt-level = 's'

[profile.release.package.config-wasm]
opt-level = 's'

[profile.release.package.hdr-histogram-wasm]
opt-level = 's'

[workspace]
members = [
    "lib/body_reader",
    "lib/channel",
    "lib/config",
    "lib/config-gen",
    "lib/config-wasm",
    "lib/either",
    "lib/hdr-histogram-wasm",
    "lib/for_each_parallel",
    "lib/mod_interval",
    "lib/scripting-macros",
    "lib/select_any",
    "lib/test_common",
    "lib/zip_all",
    "pewpew-config-updater",
]

[workspace.package]
version = "0.6.1"
license = "Apache 2.0"

[workspace.dependencies]
base64 = "0.23"
bytes = "1"
config = { path = "./lib/config" }
ether = { path = "./lib/either" }
env_logger = "0.11"
futures = "0.3"
futures-timer = "3"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
itertools = "0.15"
js-sys = "0.3.64"
log = "0.4"
once_cell = "1.17.1"
rand = "0.10"
regex = "1"
serde = "1.0.163"
serde_json = "1.0.104"
serde_yaml = "0.9.25"
thiserror = "2"
tokio = "1"
url = "2"
zip_all = { path = "./lib/zip_all" }
# https://docs.rs/getrandom/0.4.3/getrandom/#webassembly-support
# Two majors are in the wasm tree at once and each needs its own opt-in, or the wasm32 build
# fails to compile getrandom:
#   0.4 -- what rand 0.10 pulls in. The `wasm_js` feature alone enables the backend; getrandom
#          0.4 dropped the `--cfg getrandom_backend="wasm_js"` arm, so no rustflag applies.
#   0.3 -- what boa_engine 0.21 -> rand 0.9 -> rand_core 0.9 pulls in. It needs BOTH the
#          `wasm_js` feature and the `getrandom_backend` rustflag, which is why
#          lib/config-wasm/.cargo/config.toml and lib/config-gen/.cargo/config.toml still exist.
#          Drop the renamed dependency and both rustflag files once boa moves off rand 0.9.
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "0.2.87"
wasm-logger = "0.2"
