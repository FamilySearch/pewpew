[package]
name = "config"
version.workspace = true
edition = "2018"
publish = false
license.workspace = true

[dependencies]
base64.workspace = true
boa_engine = "0.22"
boa_gc = "0.22"
boa_parser = "0.22"
derivative = "2.2.0"
derive_more = { version = "2", features = ["deref", "deref_mut", "from", "from_str"] }
diplomatic-bag = "0.3.1"
ether.workspace = true
futures.workspace = true
http.workspace = true
itertools.workspace = true
js-sys.workspace = true
jsonpath_lib = "0.3.0"
log.workspace = true
nom = "8"
once_cell.workspace = true
percent-encoding = "2"
pest = { version = "2", optional = true }
pest_derive = { version = "2", optional = true }
phf = { version = "0.14", features = ["macros"] }
rand.workspace = true
regex.workspace = true
scripting-macros = { path = "../scripting-macros" }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
serde-tuple-vec-map = "1.0.1"
serde_yaml.workspace = true
thiserror.workspace = true
unicode-segmentation = "1"
yaml-rust2 = { version = "0.13", optional = true }
zip_all.workspace = true

# boa 0.22 gained a `Clock` whose default implementation calls `std::time::Instant::now()`,
# which panics with "time not implemented on this platform" on wasm32-unknown-unknown. The `js`
# feature swaps that for `web-time` (backed by `performance.now()`) and is wasm-only, so the
# native build keeps the std clock.
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { version = "0.22", features = ["js"] }

[dev-dependencies]
maplit = "1"
test_common = { path = "../test_common" }
tokio.workspace = true

[features]
convert = ["legacy"]
legacy = ["dep:yaml-rust2", "dep:pest", "dep:pest_derive"]
