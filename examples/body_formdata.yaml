# Run this file with the test-server, then specify the PORT as a parameter to this try or run script.
# The password var below contains special characters to show that they are percent-encoded into
# the form body, and that the scrub in the logger masks it with the same encoding applied.

# This version will always put in new sessions and slowly replace the old ones

vars:
  port: ${e:PORT}
  username: test-user
  password: 'test-&pass+word' # The & and + show that special characters are encoded, not passed through
  dev_key: dev-key-001

load_pattern:
  - !linear
    from: 100%
    to: 100%
    over: 15s

loggers:
  test:
    to: !stdout

endpoints:
  - method: POST
    url: http://localhost:${v:port}
    headers:
      Accept-Language: en-us
      Content-Type: application/x-www-form-urlencoded
    # Any value interpolated into a form body must be encoded, or an & in the value splits it
    # into extra parameters and a + is decoded as a space.
    body: !str username=${v:username}&password=${x:encode(${v:password}, "form-urlencoded")}&grant_type=password&client_id=${v:dev_key}&token=abcd-1234-efgh
    peak_load: 1hps
    logs:
      test:
        select:
          ts: epoch("ms")
          response: replace(encode(_v.password, "form-urlencoded"), request.body, "******")
          token: match(response.body, "token=(?P<token>[a-zA-Z0-9-]+)").token
